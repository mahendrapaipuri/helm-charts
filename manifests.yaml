data:
  k8s-single-pod-metrics.json: |-
    
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus datasource. When CEEMS LB is enabled, datasource corresponding to CEEMS LB must be configured here.",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        },
        {
          "name": "DS_GRAFANA-PYROSCOPE-DATASOURCE",
          "label": "grafana-pyroscope-datasource",
          "description": "",
          "type": "datasource",
          "pluginId": "grafana-pyroscope-datasource",
          "pluginName": "Grafana Pyroscope"
        }
      ],
      "__elements": {},
      "__requires": [
        {
          "type": "panel",
          "id": "flamegraph",
          "name": "Flame Graph",
          "version": ""
        },
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "11.3.1"
        },
        {
          "type": "datasource",
          "id": "grafana-pyroscope-datasource",
          "name": "Grafana Pyroscope",
          "version": "11.3.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "panel",
          "id": "text",
          "name": "Text",
          "version": ""
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Time series metrics of a k8s pod",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "info",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Powered by CEEMS",
          "tooltip": "Go To GitHub",
          "type": "link",
          "url": "https://github.com/ceems-dev/ceems"
        }
      ],
      "panels": [
        {
          "gridPos": {
            "h": 13,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 53,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "<span> \n  The following metrics are aggregated over entire pod duration\n</span>\n<br>\n<br>\n\n<table><tbody>\n  <tr>\n    <th rowspan=\"4\">Average Utilization (%)</th>\n    <th>CPU</th>\n    <td colspan=\"5\">${cpu_usage}</td>\n  </tr>\n  <tr>\n    <th>CPU Memory</th>\n    <td colspan=\"5\">${cpumem_usage}</td>\n  </tr>\n  <tr>\n    <th>GPU</th>\n    <td colspan=\"5\">${gpu_usage}</td>\n  </tr>\n  <tr>\n    <th>GPU Memory</td>\n    <td colspan=\"5\">${gpumem_usage}</td>\n  </tr>\n  <tr>\n    <th rowspan=\"3\">Energy Consumption (kWh)</th>\n    <th>Host</th>\n    <td colspan=\"5\">${cpu_energy}</td>\n  </tr>\n  <tr>\n    <th>GPU</th>\n    <td colspan=\"5\">${gpu_energy}</td>\n  </tr>\n  <tr>\n    <th>Total</th>\n    <td colspan=\"5\">${total_energy}</td>\n  </tr>\n  <tr>\n    <th rowspan=\"6\">Equivalent Emissions (gms)</th>\n    <th>Emission Factor</th>\n    <th>RTE</th>\n    <th>Elec. Maps</th>\n    <th>W. Time</th>\n    <th>OWID</th>\n    <th>World Avg.</th>\n  </tr>\n  <tr>\n    <th>Host</th>\n    <td>${cpu_emissions_rte}</td>\n    <td>${cpu_emissions_emaps}</td>\n    <td>${cpu_emissions_wt}</td>\n    <td>${cpu_emissions_owid}</td>\n    <td>${cpu_emissions_global}</td>\n  </tr>\n  <tr>\n    <th>GPU</th>\n    <td>${gpu_emissions_rte}</td>\n    <td>${gpu_emissions_emaps}</td>\n    <td>${gpu_emissions_wt}</td>\n    <td>${gpu_emissions_owid}</td>\n    <td>${gpu_emissions_global}</td>\n  </tr>\n  <tr>\n    <th>Total</th>\n    <td>${total_emissions_rte}</td>\n    <td>${total_emissions_emaps}</td>\n    <td>${total_emissions_wt}</td>\n    <td>${total_emissions_owid}</td>\n    <td>${total_emissions_global}</td>\n  </tr>\n</tbody></table>",
            "mode": "html"
          },
          "pluginVersion": "11.3.1",
          "title": "Aggregate Metrics",
          "type": "text"
        },
        {
          "gridPos": {
            "h": 13,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 31,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "<span> \n  Following table gives different pod meta data\n</span>\n<br>\n<br>\n\n<table width=\"100%\">\n  <thead>\n    <tr>\n      <th scope=\"col\">Attribute</th>\n      <th scope=\"col\">Value</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <th scope=\"row\">ID</th>\n      <td>${uuid}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">Name</th>\n      <td>${name}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">Account</th>\n      <td>${account}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">QoS</th>\n      <td>${qos}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">Submit Time</th>\n      <td>${submit:date:YYYY-MM-DD HH:mm:SS Z}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">Start Time</th>\n      <td>${start:date:YYYY-MM-DD HH:mm:SS Z}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">End Time</th>\n      <td>${end:date:YYYY-MM-DD HH:mm:SS Z}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">Elapsed Time</th>\n      <td>${elapsed}</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">State</th>\n      <td>${state}</td>\n    </tr>\n</tbody>\n</table>\n",
            "mode": "html"
          },
          "pluginVersion": "11.3.1",
          "title": "Pod Details",
          "type": "text"
        },
        {
          "gridPos": {
            "h": 13,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 54,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "This dashboard presents the time series metrics of pod ${uuid} running within namespace ${account}.\nCurrently the following time series metrics are available:\n\n- **CPU Stats**:\n\n    - *CPU Usage*: This shows the usage of CPU by the pod and it is estimated using CPU time.\n        In one second interval, if CPU works only for 0.2 seconds, CPU usage will be reported as 20%. \n        If a pod allocates _n_ cpus and uses all _n_\n        cpus all the time, the usage will be 100% all the time. If the pod uses only _n/2_ cpus or uses\n        _n_ cpus only 50% of time, the resulting CPU usage will be 50%.\n\n    - *CPU Memory Usage*: This is the percentage of memory used by the pod compared to the memory available\n        within k8s pod.\n\n    - *Host Energy Usage*: This is the energy consumption estimated based on total energy consumption\n        (excluding GPUs) of the\n        compute node and the resources used by the pod. Thus it includes CPU, CPU memory and other peripherals \n        on the compute node excluding GPUs. The estimation is made using CPU time, memory used\n        by the pod relative to total CPU time and total memory used by the entire node. If there are multiple\n        pods running on the node at a given time, the reported energy consumption is the energy consumed only\n        by the current pod.\n<br />\n\n- **CPU Performance Stats**: \n\n    - *CPU Frequency*: The average frequency at which all the cores in the pod allocation are running during the\n        execution of the pod.\n\n    - *CPU IPC*: Instructions Per Cylce (IPC) gives number of instructions finished per CPU cycle. An IPC value of more\n        than 1 indicates a good performing code. Higher the value of IPC, better the code performance.\n\n    - *CPU Software Events*: Two different software events are presented: Context switches and CPU migrations. Context\n        switches happens when execution context changes from user mode to kernel mod or *vice-versa*. Context switch is\n        an expensive operation and hence, more context switches means lower performing code. CPU migraion happens when\n        execution of task change from one CPU core to another. Lower is better.\n    \n    - *Page Faults*: Page faults happen when task access a memory region that is not \"prepared\". A minor page fault\n        happens when page is loaded into the memory but it not mapped. On the otherhand major fault happens when page\n        is not loaded in the memory. Lower is better. Minor page faults will not have huge impact on the performance\n        where as higher major page faults indicates bad memory management by the code.\n\n    - *Cache Events*: Cache events indicate the cache efficiency of the code. Currently supported events are L1 read\n        misses ratio and LL read/write misses ratio. Lower is better. L1 is first level cache with very fast access times\n        but limited size where LL is last level cache with slower access times but with larger size. A higher miss ratio\n        indicates that the code needs to fetch the data from the memory often indicates bad caching efficiency.\n<br />\n\n- **GPU Stats**:\n\n    - *GPU Usage*: This shows the GPU usage reported by [NVML](https://developer.nvidia.com/management-library-nvml).\n        According to [NVML docs](https://docs.nvidia.com/deploy/nvml-api/structnvmlUtilization__t.html#structnvmlUtilization__t),\n        it is percent of time over the past sample period during which one or more kernels was executing on the GPU.\n\n    - *GPU Memory Usage*: This is the percentage of memory used by the pod compared to the available memory on\n        the GPU.\n\n    - *GPU Energy Usage*: This is the energy consumption reported by [NVML](https://developer.nvidia.com/management-library-nvml)\n        by the GPU.\n<br />\n\n- **GPU Profiling Stats**: NVIDIA DCGM [docs](https://docs.nvidia.com/datacenter/dcgm/latest/user-guide/feature-overview.html#profiling-metrics)\nexplains all the presented GPU profiling metrics.\n<br />\n\n- **IO Stats**:\n\n    - *Read/Write bandwidths*: Read/Write bandwidths from different compute nodes for different\n        file systems.\n\n    - *Read/Write Requests*: Number of requests for read/write from different compute nodes for different \n        file systems.\n\n    - *Read/Write Errors*: Number of errors while executing read/write requests from different compute nodes\n        for different file systems.\n<br />\n\n- **Profiling**: This is very minimal/low overhead profiling of the code done using eBPF based continuous profiling tool\n. In a nutshell, the profiler samples the code\n    at a frequency and builds a histogram of data of how many times code executed in different regions of\n    the code. By resolving the regions to the function names, a flame graph is built to show the time spent\n    in each function of the code. For the better resolution of the function names, debug symbols must be\n    included in the application binaries. It is also recommended to include frame pointers using the flag\n    `-fno-omit-frame-pointer` in the compiler options. More details on how to intrepret flame graphs can be\n    found in [Grafana Pyroscope Docs](https://grafana.com/docs/pyroscope/latest/introduction/flamegraphs/).",
            "mode": "markdown"
          },
          "pluginVersion": "11.3.1",
          "title": "README",
          "type": "text"
        },
